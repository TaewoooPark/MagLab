repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key   # blocks commits of auth.json and API keys (§7.2)
  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: mypy maglab
        language: system
        types: [python]
        pass_filenames: false
