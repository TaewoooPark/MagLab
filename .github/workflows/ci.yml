name: CI

on:
  push:
    branches: [main]
  pull_request:

# Install only core + dev for validation (no extras — PLAN §18 "core install requires no GPU or LLM").
# `uv run` attempts to universally lock all extras, so venv binaries are called directly instead.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv & install (core + dev)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy maglab

      - name: Core install smoke (no extras)
        run: .venv/bin/maglab --help

      - name: Unit + golden tests
        run: .venv/bin/pytest
