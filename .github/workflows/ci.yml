name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Install the research bundle plus dev tools so the full test suite can exercise
# optional MagLab subsystems. `uv run` attempts to universally lock all extras,
# so venv binaries are called directly instead.
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create venv & install (research + dev)
        run: |
          uv venv --python ${{ matrix.python }}
          uv pip install -e ".[research,dev]"

      - name: Lint (ruff)
        run: .venv/bin/ruff check .

      - name: Format check (ruff)
        run: .venv/bin/ruff format --check .

      - name: Type check (mypy)
        run: .venv/bin/mypy maglab

      - name: Core install smoke (no extras)
        run: .venv/bin/maglab --help

      - name: Unit + golden tests
        run: env -u NO_COLOR PYVISTA_OFF_SCREEN=true MAGLAB_SKIP_PYVISTA_3D=1 MPLBACKEND=Agg .venv/bin/pytest
