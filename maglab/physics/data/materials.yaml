# Curated magnetic-materials database
#
# Entry structure:
#   name         : material name
#   formula      : chemical formula
#   Ms_Am        : saturation magnetisation [A/m] at 300 K (or stated temperature)
#   A_Jm         : exchange stiffness [J/m] at 300 K
#   K_Jm3        : anisotropy constant [J/m³] at 300 K
#     K1 (first-order magnetocrystalline anisotropy constant) or K_u (uniaxial anisotropy)
#   alpha        : Gilbert damping constant [dimensionless] at 300 K
#   T_C_K        : Curie temperature [K]
#   g_factor     : g-factor [dimensionless]
#   source_doi   : source DOI or textbook reference
#   notes        : supplementary notes
#
# Source priority:
#   primary literature > authoritative textbooks > review articles
#   Coey = Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010)
#   Hubert = Hubert & Schäfer, "Magnetic Domains" (Springer, 1998)
#   Johnson = Johnson et al., Phys. Rev. B 60, 7802 (1999)
#
# Unit note: Ms is A/m (SI), A is J/m, K is J/m³
# Conversion: 1 emu/cm³ = 1000 A/m, 1 erg/cm = 1e-3 J/m, 1 erg/cm³ = 0.1 J/m³

materials:

  - id: Fe
    name: "Iron (bcc)"
    formula: "Fe"
    structure: "bcc"
    Ms_Am: 1.71e6        # 1710 emu/cm³ = 1.71e6 A/m at 293 K
    A_Jm: 2.1e-11        # 2.1×10⁻¹¹ J/m (= 2.1 μerg/cm)
    K_Jm3: 4.8e4         # K₁ = 4.8×10⁴ J/m³ at 300 K (in-plane cubic anisotropy)
    alpha: 0.0027        # damping — Heinrich et al., JMMM 1985
    T_C_K: 1043.0        # Curie temperature
    g_factor: 2.09       # Coey p. 161
    source_doi: "10.1016/0304-8853(85)90069-X"
    source_ref: >
      Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010), Table 6.1.
      Heinrich & Cochran, Adv. Phys. 42, 523 (1993).
    notes: >
      bcc iron. K₁ > 0, so [100] is the easy axis.
      Ms corresponds to 4πMs = 2.15 T (CGS: 21500 G).

  - id: Co
    name: "Cobalt (hcp)"
    formula: "Co"
    structure: "hcp"
    Ms_Am: 1.44e6        # 1440 emu/cm³
    A_Jm: 1.3e-11        # 1.3×10⁻¹¹ J/m
    K_Jm3: 4.1e5         # K_u = 4.1×10⁵ J/m³ (uniaxial, along the c-axis)
    alpha: 0.011         # representative value; literature range 0.005–0.02
    T_C_K: 1388.0
    g_factor: 2.16       # Coey p. 161
    source_doi: "10.1017/CBO9780511845000"
    source_ref: >
      Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010), Table 6.1.
      Skomski & Coey, "Permanent Magnetism" (IOP, 1999), Table 2.3.
    notes: >
      hcp cobalt. K_u > 0, so the c-axis is the easy axis.
      fcc Co (T > 690 K) has K₁ < 0 (cubic).

  - id: Ni
    name: "Nickel (fcc)"
    formula: "Ni"
    structure: "fcc"
    Ms_Am: 4.85e5        # 485 emu/cm³
    A_Jm: 0.9e-11        # 0.9×10⁻¹¹ J/m
    K_Jm3: -4.5e3        # K₁ = −4.5×10³ J/m³ at 300 K (in-plane [111] easy axis)
    alpha: 0.023         # representative FMR-measured value
    T_C_K: 627.0
    g_factor: 2.21       # Coey p. 161
    source_doi: "10.1017/CBO9780511845000"
    source_ref: >
      Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010), Table 6.1.
    notes: >
      fcc nickel. K₁ < 0, so [111] is the easy axis.

  - id: Permalloy
    name: "Permalloy (Ni₈₀Fe₂₀)"
    aliases: ["Py", "NiFe", "Ni80Fe20"]
    formula: "Ni80Fe20"
    structure: "fcc-alloy"
    Ms_Am: 8.0e5         # 800 emu/cm³; literature range 795–860 emu/cm³
    A_Jm: 1.3e-11        # 1.3×10⁻¹¹ J/m; some references 1.0–1.3e-11
    K_Jm3: 0.0           # anisotropy near zero (result of composition optimisation)
    alpha: 0.008         # representative FMR-measured value
    T_C_K: 843.0
    g_factor: 2.12
    source_doi: "10.1103/PhysRevB.60.7802"
    source_ref: >
      Johnson et al., Phys. Rev. B 60, 7802 (1999).
      Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010), p. 337.
      Hubert & Schäfer, "Magnetic Domains" (Springer, 1998), Table A.2.
    notes: >
      Ni₈₀Fe₂₀ alloy. Exchange length l_ex = sqrt(2A/μ₀Ms²) ≈ 5.3 nm.
      Reference soft-magnetic material for device applications.

  - id: CoFeB
    name: "CoFeB (Co₂₀Fe₆₀B₂₀)"
    formula: "Co20Fe60B20"
    structure: "amorphous"
    Ms_Am: 1.1e6         # 1100 emu/cm³; literature range 1.0–1.3×10⁶ A/m
    A_Jm: 1.5e-11        # amorphous estimate; literature range 1.0–2.0e-11
    K_Jm3: 0.0           # amorphous — intrinsic anisotropy near zero
    alpha: 0.004         # value measured after annealing
    T_C_K: 1100.0        # estimate (based on CoFe alloys)
    g_factor: 2.09
    source_doi: "10.1063/1.2938939"
    source_ref: >
      Ikeda et al., Nature Materials 9, 721 (2010), Supplementary.
      Liu et al., J. Appl. Phys. 101, 09C509 (2007).
    notes: >
      Reference material for p-MTJs. Amorphous as-deposited; crystallises after
      MgO-junction annealing.
      K_u (PMA from the MgO interface) is a separate interfacial contribution —
      only the bulk value is given here.

  - id: YIG
    name: "YIG (yttrium iron garnet)"
    formula: "Y3Fe5O12"
    structure: "garnet"
    Ms_Am: 1.43e5        # 143 emu/cm³ at 300 K (= 1430 G in CGS)
    A_Jm: 4.0e-12        # 4.0×10⁻¹² J/m; literature range 3.5–4.0e-12
    K_Jm3: -610.0        # K₁ ≈ −610 J/m³ at 300 K (weak cubic anisotropy)
    alpha: 0.0002        # from FMR linewidth measurements; among the lowest known
    T_C_K: 559.0
    g_factor: 2.004      # spin-only g ≈ 2.0
    source_doi: "10.1103/PhysRevB.71.064445"
    source_ref: >
      Cherepanov et al., Phys. Rep. 229, 81 (1993), Table 1.
      Stancil & Prabhakar, "Spin Waves" (Springer, 2009), Table 3.1.
      Guo et al., Phys. Rev. B 71, 064445 (2005).
    notes: >
      Reference material for spin-wave / magnon transport. For single crystals,
      α as low as 0.0001 has been reported.
      μ₀Ms ≈ 0.18 T.

  - id: GdFeCo
    name: "GdFeCo amorphous alloy"
    formula: "Gd22Fe68Co10"
    structure: "amorphous"
    Ms_Am: 5.0e4         # ~50 emu/cm³ near the compensation composition; strongly composition-dependent
    A_Jm: 5.5e-12        # estimate for the amorphous Fe-rich ferrimagnet
    K_Jm3: 1.0e4         # uniaxial anisotropy (PMA)
    alpha: 0.02          # representative value
    T_C_K: 520.0         # composition-dependent
    g_factor: 2.0        # effective g-factor (Gd: 2.0, FeCo: ~2.1)
    source_doi: "10.1103/PhysRevLett.99.217204"
    source_ref: >
      Stanciu et al., Phys. Rev. Lett. 99, 217204 (2007).
      Radu et al., Nature 472, 205 (2011).
    notes: >
      Rare-earth–transition-metal ferrimagnet. The angular-momentum compensation
      point T_comp differs from the magnetic compensation point T_M.
      Parameters depend strongly on composition — these are representative estimates.

  - id: MnBi
    name: "MnBi"
    formula: "MnBi"
    structure: "hexagonal"
    Ms_Am: 6.25e5        # 625 emu/cm³ at 300 K
    A_Jm: 1.0e-12        # estimate (sparse literature)
    K_Jm3: 9.0e5         # K_u perpendicular anisotropy at 300 K
    alpha: 0.1           # high damping
    T_C_K: 628.0
    g_factor: 2.1
    source_doi: "10.1063/1.4943750"
    source_ref: >
      Coey, "Magnetism and Magnetic Materials" (Cambridge, 2010), p. 326.
      Sato et al., Appl. Phys. Lett. 108, 102405 (2016).
    notes: >
      Rare-earth-free permanent-magnet candidate material with strong uniaxial
      anisotropy.
      K_u rises anomalously with increasing temperature (it decreases below
      room temperature).
