# MagLab figure style constraints — elsarticle (Elsevier: JMMM, Acta Materialia)
# Used by the figure engine (§12) and section_drafter (§16.5).
# HUMAN REVIEW REQUIRED — verify against current journal author guidelines.

journal_class: elsarticle

# Column widths (mm)
column_single_mm: 90
column_double_mm: 190

# Resolution (DPI)
dpi_raster: 300
dpi_line_art: 600

# Font constraints
min_font_size_pt: 8
font_type: 42              # Type 42 TrueType required by Elsevier production

# Line width
min_line_width_pt: 0.5

# Colour palette
colour_mode: rgb            # Elsevier accepts RGB; CMYK for print-specific journals
colour_blind_safe: true

# File format
vector_format: pdf          # PDF preferred; EPS also accepted
raster_format: tiff
max_file_size_mb: 25        # Elsevier allows larger uploads via EES

# Panel layout
max_panels_per_figure: 8
panel_label_font_size_pt: 8
panel_label_style: bold    # Elsevier uses bold (a), (b), (c) in captions

# White space
panel_gap_mm: 1.5
figure_border_mm: 0
