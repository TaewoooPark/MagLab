# MagLab figure style constraints — revtex4-2-aip (AIP: APL, JAP, APL Materials)
# Used by the figure engine (§12) and section_drafter (§16.5).
# HUMAN REVIEW REQUIRED — verify against current journal author guidelines.

journal_class: revtex4-2-aip

# Column widths (mm)
column_single_mm: 83       # APL / JAP single-column
column_double_mm: 172

# Resolution (DPI)
dpi_raster: 300
dpi_line_art: 600

# Font constraints
min_font_size_pt: 8
font_type: 42

# Line width
min_line_width_pt: 0.5

# Colour palette
colour_mode: rgb            # AIP accepts RGB
colour_blind_safe: true

# File format
vector_format: pdf
raster_format: tiff
max_file_size_mb: 10

# Panel layout
max_panels_per_figure: 6
panel_label_font_size_pt: 8
panel_label_style: regular  # AIP uses (a), (b), (c)

# White space
panel_gap_mm: 1.0
figure_border_mm: 0
