# MagLab figure style constraints — IEEEtran (IEEE Magnetics Letters, Trans. Magnetics)
# Used by the figure engine (§12) and section_drafter (§16.5).
# HUMAN REVIEW REQUIRED — verify against current journal author guidelines.

journal_class: IEEEtran

# Column widths (mm)
column_single_mm: 88.9     # IEEE standard single-column ≈ 3.5 inches
column_double_mm: 182      # Full-width (two-column layout)

# Resolution (DPI)
dpi_raster: 300
dpi_line_art: 600

# Font constraints
min_font_size_pt: 8
font_type: 42

# Line width
min_line_width_pt: 0.5

# Colour palette
colour_mode: rgb
colour_blind_safe: true

# File format
vector_format: pdf          # PDF or EPS accepted
raster_format: tiff         # TIFF; PNG accepted in submission
max_file_size_mb: 10

# Panel layout
max_panels_per_figure: 6
panel_label_font_size_pt: 8
panel_label_style: regular  # IEEE uses (a), (b), (c)

# White space
panel_gap_mm: 1.0
figure_border_mm: 0
