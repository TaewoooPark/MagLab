# MagLab figure style constraints — revtex4-2 (APS: PRL, PRB, PRX, PR Applied, PR Materials)
# Used by the figure engine (§12) and section_drafter (§16.5).
# HUMAN REVIEW REQUIRED — verify against current journal author guidelines.

journal_class: revtex4-2

# Column widths (mm)
column_single_mm: 86
column_double_mm: 178

# Resolution (DPI)
dpi_raster: 600            # APS recommends 600 dpi for line art and halftones
dpi_line_art: 1200

# Font constraints
min_font_size_pt: 8
font_type: 42

# Line width
min_line_width_pt: 0.25    # APS allows finer lines than most publishers

# Colour palette
colour_mode: rgb            # APS accepts RGB for online; CMYK for print
colour_blind_safe: true     # Strongly recommended for Physical Review journals

# File format
vector_format: pdf          # PDF preferred; EPS also accepted
raster_format: tiff
max_file_size_mb: 10

# Panel layout
max_panels_per_figure: 6
panel_label_font_size_pt: 8
panel_label_style: regular  # APS uses (a), (b), (c) without bold

# White space
panel_gap_mm: 1.0
figure_border_mm: 0
